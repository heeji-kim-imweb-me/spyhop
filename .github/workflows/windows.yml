name: Windows preview

# 커뮤니티 Windows 판(windows/). 맥 판과 코드를 나누지 않으므로 windows/ 가 바뀔 때만 돈다
on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        # 브라우저 화면(test_board_ui)·동시 요청(test_robustness)·데모 화면(test_topic_groups) 시험은 러너 환경에 따라 결과가 달라 로컬에서만 돌린다
        run: cd windows/tests; python -X utf8 -m unittest test_lifecycle test_omp test_focus test_summary_lang test_app_sessions test_windows
